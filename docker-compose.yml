services:
  game:
    build:
      context: .
      target: game
    ports:
      - "8080:80"
    restart: unless-stopped

  relay:
    build:
      context: .
      target: relay
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:9000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
